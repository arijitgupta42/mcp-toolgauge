name: Deploy dashboard to Pages

# Publishes the dashboard (dashboard/) to GitHub Pages.
#
# The push trigger is guarded rather than absent (see the build job's `if`). GitHub Pages
# will not serve a private repo without a paid plan, so while the repo is private a
# push-triggered run would fail on every merge to main -- and main must stay green. The guard
# skips the run (green, not failed) until the repo is public, at which point every merge
# republishes with no further edit to this file. Enabling Pages is a one-time manual step:
# Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; nothing else in the repo does, so they are scoped to this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time. Do not cancel a running deploy -- a half-published site is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # A manual dispatch always runs; a push only once the repo is public and Pages can
    # actually serve it. Until then the push run is skipped, which keeps main green.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.visibility == 'public'
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Pages serves from a repo subpath (https://<user>.github.io/mcpcheckup/), so the build
      # is told that prefix or every asset URL 404s. A site served from a domain root sets
      # VITE_BASE=/ instead -- which is what the self-hosted deployment does.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /mcpcheckup/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
