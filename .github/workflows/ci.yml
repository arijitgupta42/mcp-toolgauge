name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy mcp_doctor

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # stdio means subprocess handling, which is exactly where Windows differs from
        # POSIX -- so it gets its own job rather than being assumed to work.
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -v --color=yes

  dashboard:
    name: dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Types, the unit tests that pin the dashboard's score/confusion logic to the Python,
      # and a real production build. The build is what proves the committed demo reports and
      # the app actually compile together, not just that the source type-checks.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  smoke:
    name: uvx smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # The headline commands from the README. If these break, the front page is a lie.
      - name: inspect the fixture servers
        run: |
          uv run mcp-doctor inspect tests/fixtures/badserver
          uv run mcp-doctor inspect tests/fixtures/goodserver
          uv run mcp-doctor inspect tests/fixtures/goodserver --json > /dev/null

      # goodserver must be clean and badserver must not be. Asserted on every push, so a
      # rule that quietly stops firing cannot slip through green.
      - name: lint the fixture servers
        run: |
          uv run mcp-doctor lint tests/fixtures/goodserver -v
          if uv run mcp-doctor lint tests/fixtures/badserver; then
            echo "::error::badserver produced no findings at or above --fail-on"
            exit 1
          fi
          uv run mcp-doctor lint tests/fixtures/badserver --sarif --fail-on off > /dev/null
          uv run mcp-doctor lint tests/fixtures/badserver --json --fail-on off > /dev/null

      # Replays the recorded caches: no API key, no network, no cost. Deliberately run on
      # the base install rather than the `eval` extra, which is what proves --offline works
      # without a model backend present.
      #
      # One bar, both directions. goodserver has to clear it and badserver has to miss it,
      # so a change that quietly closes the gap fails here rather than shipping.
      - name: replay the recorded evals
        run: |
          uv run mcp-doctor eval tests/fixtures/goodserver --offline --min-accuracy 75
          if uv run mcp-doctor eval tests/fixtures/badserver --offline --min-accuracy 75; then
            echo "::error::badserver scored at or above 75%; the fixture gap has closed"
            exit 1
          fi
          uv run mcp-doctor eval tests/fixtures/goodserver --offline --json > /dev/null

      # The health gate, both directions, from the same offline replay -- no key, no network,
      # no cost. goodserver has to clear --min-score and badserver has to miss it, so a change
      # that quietly breaks the score fails here rather than shipping. Also exercises the
      # badge and comment renderers so a broken one cannot slip through green.
      - name: score the fixture servers
        run: |
          uv run mcp-doctor ci tests/fixtures/goodserver --min-score 70
          if uv run mcp-doctor ci tests/fixtures/badserver --min-score 70; then
            echo "::error::badserver cleared --min-score 70; the health gate has stopped working"
            exit 1
          fi
          uv run mcp-doctor ci tests/fixtures/goodserver --json > /dev/null
          uv run mcp-doctor ci tests/fixtures/goodserver --badge "$RUNNER_TEMP/badge.json"
          uv run mcp-doctor ci tests/fixtures/goodserver --markdown "$RUNNER_TEMP/comment.md"
