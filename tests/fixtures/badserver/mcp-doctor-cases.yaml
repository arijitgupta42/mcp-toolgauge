- id: ticket-vs-ticket2-s1
  kind: sibling
  expected: ticket
  rival: ticket2
  prompt: Open a ticket for alice, remote login keeps failing with an auth error and it is
    holding up her whole day.
  note: >-
    Written by hand, with the three below it, and the labels are arbitrary on purpose. This
    is the pair MCP001 and MCP013 both flag: `ticket` and `ticket2` take the same subject,
    body and user, differ only in whether the fourth parameter is called priority or
    urgency, and are described as "Creates a ticket in the support system with the supplied
    subject and body." and "Creates a ticket."

    No user request can distinguish them, so no correct answer exists and a coin flip is the
    honest expected result. That is the finding rather than a flaw in the case: the linter
    says delete one of these, and this is what keeping both costs. The earlier draft scored
    8/8 here only because its prompts said "priority high" and "urgency critical" outright,
    which let the model match a parameter instead of reading a description.
