[project]
name = "mcp-toolgauge"
version = "0.1.0"
description = "Lint, evaluate, and CI-gate MCP servers. Find out why your tools don't get called."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arijit Gupta" }]
keywords = ["mcp", "model-context-protocol", "linter", "eval", "llm", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=2.0.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    # Reading and writing the eval case file. In the base install rather than the `eval`
    # extra so that `eval --offline` -- replaying a committed cache, which calls no model
    # at all -- works without pulling in a model backend.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only `eval` without --offline needs a model backend, and LiteLLM is a large install.
# Keeping it out of the base package is what keeps `uvx mcp-toolgauge lint` fast, and lint is
# the command that runs on every pull request.
eval = ["litellm>=1.60.0"]

[project.urls]
Homepage = "https://github.com/arijitgupta42/mcp-toolgauge"
Issues = "https://github.com/arijitgupta42/mcp-toolgauge/issues"

[project.scripts]
mcp-toolgauge = "mcp_toolgauge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_toolgauge"]

# Without an explicit list, hatchling sweeps the whole working tree into the sdist --
# including dashboard/node_modules, which is a 17 MB source distribution dominated by a
# Windows esbuild.exe. The dashboard is a separate npm project, not part of the Python
# package, so name exactly what belongs in the source release and nothing else. The two
# fixture servers (with their committed eval caches) come in via tests/, so `eval --offline`
# works from an sdist install too.
[tool.hatch.build.targets.sdist]
only-include = [
    "mcp_toolgauge",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Fixture servers are deliberately awful; that is the point of them.
"tests/fixtures/**" = ["D", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: spawns a real fixture server subprocess",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Strict on the shared vocabulary and on the scoring maths -- the models everything crosses
# and the numbers everything is judged by are worth the extra rigour.
module = [
    "mcp_toolgauge.model.*",
    "mcp_toolgauge.health",
    "mcp_toolgauge.history",
    "mcp_toolgauge.eval.score",
    "mcp_toolgauge.eval.arguments",
]
strict = true
